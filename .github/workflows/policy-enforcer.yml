- name: Download AI risk artifact
  uses: actions/download-artifact@v4
  with:
    name: ai-risk
    path: .

- name: Enforce AI risk policy
  run: |
    MAX_SCORE=$(yq '.rules.ai_risk.max_score' security_policy.yaml)
    AI_SCORE=$(jq '.total_score' ai-risk.json)

    echo "AI Score: $AI_SCORE"
    echo "Max Allowed: $MAX_SCORE"

    if [ "$AI_SCORE" -gt "$MAX_SCORE" ]; then
      echo "❌ Policy violation: AI risk too high"
      exit 1
    else
      echo "✅ AI risk within allowed limits"
    fi
