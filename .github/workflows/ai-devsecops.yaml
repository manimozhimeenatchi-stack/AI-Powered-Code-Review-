name: Automated Code Safety Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-safety:
    name: Check if code is safe
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Identify base branch
      - name: Identify base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_BRANCH=${{ github.base_ref }}" >> "$GITHUB_ENV"
          else
            echo "BASE_BRANCH=main" >> "$GITHUB_ENV"
          fi

      # 3️⃣ Fetch base branch
      - name: Fetch base branch
        run: |
          git fetch origin "$BASE_BRANCH"

      # 4️⃣ Detect changed code
      - name: Detect changed code
        run: |
          git diff origin/"$BASE_BRANCH" > changed_code.txt

      # 5️⃣ Trivy security scan (HIGH / CRITICAL only)
      - name: Scan for security risks
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table
          output: trivy-report.txt

      # 6️⃣ AI Code Review (YAML-safe)
      - name: AI reviews the changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -s changed_code.txt ]; then
            echo "No code changes detected." > ai_review.md
            exit 0
          fi

          printf "You are a senior DevSecOps engineer.\n\n" > prompt.txt
          printf "Review the following Git diff and provide:\n" >> prompt.txt
          printf "- Security issues\n" >> prompt.txt
          printf "- Code quality issues\n" >> prompt.txt
          printf "- Best practice improvements\n" >> prompt.txt
          printf -- "- Overall risk level: Low, Medium, or High\n\n" >> prompt.txt
          printf "Respond in clean Markdown.\n\n" >> prompt.txt
          printf "Git diff:\n" >> prompt.txt

          cat changed_code.txt >> prompt.txt

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg content "$(cat prompt.txt)" \
              '{
                model: "gpt-4o-mini",
                messages: [
                  { "role": "system", "content": "You are a DevSecOps code reviewer" },
                  { "role": "user", "content": $content }
                ]
              }')")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai_review.md

      # 7️⃣ Final summary (ALWAY runs)
      - name: Final decision: Allow or Block
        if: always()
        run: |
          echo "# 🚦 Automated Code Review Result" > final_summary.md

          if [ "${{ job.status }}" = "failure" ]; then
            STATUS="🔴 BLOCKED"
            DECISION="❌ DO NOT merge this code"
          else
            STATUS="🟢 SAFE – Can Merge"
            DECISION="✅ Safe to merge"
          fi

          echo "## Overall Status: $STATUS" >> final_summary.md
          echo "" >> final_summary.md
          echo "### Recommendation" >> final_summary.md
          echo "$DECISION" >> final_summary.md

      # 8️⃣ Upload artifacts (ALWAYS)
      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            final_summary.md
            ai_review.md
            changed_code.txt
            trivy-report.txt

      # 9️⃣ Post result on Pull Request
      - name: Post result on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');

            const summary = fs.readFileSync('final_summary.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: summary
            });
