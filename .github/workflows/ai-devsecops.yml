name: AI DevSecOps Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ai-devsecops:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout full history
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Detect base branch safely (PR + push)
      - name: Set base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "BASE_BRANCH=main" >> $GITHUB_ENV
          fi

      # 3️⃣ Fetch base branch
      - name: Fetch base branch
        run: git fetch origin $BASE_BRANCH

      # 4️⃣ Get code diff
      - name: Get code diff
        run: |
          git diff origin/$BASE_BRANCH > changed_code.txt
          echo "===== CHANGED CODE ====="
          cat changed_code.txt

      # 5️⃣ Trivy scan (FAIL pipeline on HIGH / CRITICAL)
      - name: Run Trivy security scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true

      # 6️⃣ Run REAL OpenAI Code Review
      - name: Run AI Code Review (OpenAI)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -s changed_code.txt ]; then
            echo "No code changes to review."
            echo "No changes detected." > ai_review.md
            exit 0
          fi

          PROMPT=$(cat <<'EOF'
You are a senior DevSecOps engineer.

Review the following Git diff and provide:
- 🔐 Security issues
- 🧹 Code quality issues
- ✅ Best practice improvements
- 🚨 Overall risk level (Low / Medium / High)

Respond in clean Markdown.

Git diff:
EOF
)

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a DevSecOps code reviewer\"},
                {\"role\": \"user\", \"content\": \"${PROMPT}\n$(cat changed_code.txt)\"}
              ]
            }")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai_review.md
          echo "===== AI REVIEW ====="
          cat ai_review.md

      # 7️⃣ Upload AI Review as artifact
      - name: Upload AI Review
        uses: actions/upload-artifact@v4
        with:
          name: ai-code-review
          path: ai_review.md

      # 8️⃣ Upload changed code for demo/audit
      - name: Upload changed code
        uses: actions/upload-artifact@v4
        with:
          name: changed-code
          path: changed_code.txt

      # 9️⃣ Post AI review as PR comment (WOW factor)
      - name: Post AI review as PR comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const review = fs.readFileSync('ai_review.md', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## 🤖 AI Code Review\n\n${review}`
            });
