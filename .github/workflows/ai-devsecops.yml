name: AI DevSecOps Pipeline

on:
  pull_request:

jobs:
  ai-devsecops:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Get code diff
        run: git diff origin/main > changed_code.txt

      - name: Run Trivy scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          format: json
          output: trivy-report.json

      - name: Build AI image
        run: docker build -t ai-devsecops .

      - name: Run Code Review AI
        run: |
          docker run             -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}             -v ${{ github.workspace }}:/app             ai-devsecops python review.py

      - name: Run Trivy AI Summary
        run: |
          docker run             -e OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}             -v ${{ github.workspace }}:/app             ai-devsecops python trivy_ai_review.py

      - name: Upload Security Report
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-report
          path: ai-security-summary.txt
