name: AI Code Review

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  ai-review:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository with full history
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Fetch main branch explicitly (extra safety)
      - name: Fetch main branch
        run: git fetch origin main

      # 3️⃣ Get changed code compared to main
      - name: Get changed code
        run: |
          git diff origin/main > changed_code.txt
          echo "Changed code:"
          cat changed_code.txt

      # 4️⃣ Call OpenAI (example placeholder)
      - name: AI Code Review
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          echo "Running AI review..."
          echo "OPENAI_API_KEY is set ✅"
          # Your actual OpenAI API call logic goes here
