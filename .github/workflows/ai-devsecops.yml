name: 🚦 Automated Code Safety Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  code-safety:
    name: Check if code is safe
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout repository
      - name: 📥 Checkout source code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Identify base branch
      - name: 🧭 Identify base branch
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "BASE_BRANCH=${{ github.base_ref }}" >> $GITHUB_ENV
          else
            echo "BASE_BRANCH=main" >> $GITHUB_ENV
          fi

      # 3️⃣ Fetch base branch
      - name: 🔄 Fetch base branch
        run: git fetch origin $BASE_BRANCH

      # 4️⃣ Detect changed code
      - name: 🔍 Detect changed code
        run: |
          git diff origin/$BASE_BRANCH > changed_code.txt
          echo "Changed code detected."

      # 5️⃣ Run Trivy scan (FAIL on HIGH / CRITICAL)
      - name: 🔐 Scan for security risks
        uses: aquasecurity/trivy-action@0.24.0
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          exit-code: 1
          ignore-unfixed: true
          format: table
          output: trivy-report.txt

      # 6️⃣ Run AI code review (real OpenAI call)
      - name: 🤖 AI reviews the changes
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ ! -s changed_code.txt ]; then
            echo "No code changes detected." > ai_review.md
            exit 0
          fi

          PROMPT=$(cat <<'EOF'
You are a senior DevSecOps engineer.

Review the following Git diff and provide:
- 🔐 Security issues
- 🧹 Code quality issues
- ✅ Best practice improvements
- 🚨 Overall risk level (Low / Medium / High)

Respond in clean Markdown.

Git diff:
EOF
)

          RESPONSE=$(curl -s https://api.openai.com/v1/chat/completions \
            -H "Authorization: Bearer $OPENAI_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{
              \"model\": \"gpt-4o-mini\",
              \"messages\": [
                {\"role\": \"system\", \"content\": \"You are a DevSecOps code reviewer\"},
                {\"role\": \"user\", \"content\": \"${PROMPT}\n$(cat changed_code.txt)\"}
              ]
            }")

          echo "$RESPONSE" | jq -r '.choices[0].message.content' > ai_review.md

      # 7️⃣ Generate FINAL SUMMARY (ALWAYS RUNS)
      - name: 🚦 Final decision: Allow or Block
        if: always()
        run: |
          echo "# 🚦 Automated Code Review Result" > final_summary.md

          if [ "${{ job.status }}" = "failure" ]; then
            STATUS="🔴 BLOCKED"
            DECISION="❌ Do NOT merge this code"
          else
            STATUS="🟢 SAFE – Can Merge"
            DECISION="✅ Safe to merge"
          fi

          echo "## Overall Status: $STATUS" >> final_summary.md
          echo "" >> final_summary.md

          echo "### 🔐 Security Scan" >> final_summary.md
          if [ -f trivy-report.txt ]; then
            echo "- Security scan completed (see report below)" >> final_summary.md
          else
            echo "- Security scan not available" >> final_summary.md
          fi

          echo "" >> final_summary.md
          echo "### 🤖 AI Review Summary" >> final_summary.md
          if [ -f ai_review.md ]; then
            cat ai_review.md >> final_summary.md
          else
            echo "- AI review not generated" >> final_summary.md
          fi

          echo "" >> final_summary.md
          echo "### ✅ Recommendation" >> final_summary.md
          echo "$DECISION" >> final_summary.md

      # 8️⃣ Upload artifacts (ALWAYS)
      - name: 📦 Upload security report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-report
          path: |
            final_summary.md
            ai_review.md
            changed_code.txt
            trivy-report.txt

      # 9️⃣ Post result as PR comment
      - name: 💬 Post result on Pull Request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = fs.readFileSync('final_summary.md', 'utf8');

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
