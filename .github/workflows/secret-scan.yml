name: Secret Scan - Gitleaks

on:
  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install Gitleaks (version pinned)
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 3️⃣ Run Gitleaks scan (always generate report)
      - name: Run Gitleaks scan
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 0

      # 4️⃣ Upload report as artifact (always)
      - name: Upload Gitleaks report
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      # 5️⃣ Fail ONLY if real secrets are found (ARRAY-SAFE)
      - name: Fail if secrets detected
        run: |
          COUNT=$(jq 'if type=="array" then length else (.findings | length // 0) end' gitleaks-report.json)

          if [ "$COUNT" -gt 0 ]; then
            echo "❌ $COUNT secret(s) detected. Blocking PR."
            exit 1
          else
            echo "✅ No secrets detected."
          fi
