name: Secret Scan - Gitleaks

on:
  pull_request:
    branches:
      - main

jobs:
  secret-scan:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2️⃣ Install Gitleaks (version pinned – stable)
      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.24.3
          curl -sSL https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # 3️⃣ Run Gitleaks scan
      - name: Run Gitleaks scan
        id: gitleaks
        run: |
          gitleaks detect \
            --source . \
            --redact \
            --report-format json \
            --report-path gitleaks-report.json \
            --exit-code 1 || true

      # 4️⃣ Upload report safely (always runs)
      - name: Upload Gitleaks report
        if: always() && hashFiles('gitleaks-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json

      # 5️⃣ Fail job if secrets were found
      - name: Fail if secrets detected
        run: |
          if [ -s gitleaks-report.json ]; then
            echo "❌ Secrets detected. Blocking PR."
            exit 1
          else
            echo "✅ No secrets detected."
          fi
